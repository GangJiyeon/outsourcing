<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #777;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: calc(100vw - 5.5vw);
      height: calc(100vh - 7.5vh);
      margin: 3.75vh auto;

      border: 2px solid #1769e0;

      overflow: hidden;
    }

    /* --------------------------------
       TOP LEFT
    -------------------------------- */

    .profile {
      position: absolute;
      top: 38px;
      left: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile .role {
      font-size: 17px;
      font-weight: 400;
      color: #777;
      letter-spacing: -0.3px;
    }

    .profile .name {
      font-size: 18px;
      font-weight: 700;
      color: #1769e0;
      letter-spacing: -0.4px;
    }


    /* --------------------------------
       TOP RIGHT YEAR
    -------------------------------- */

    .year {
      position: absolute;
      top: 38px;
      right: 40px;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-size: 17px;
      line-height: 19px;
      color: #888;
      font-weight: 400;
    }

    .year-line {
      width: 2px;
      height: 34px;
      margin-top: 9px;

      background: #d9c9ef;
    }


    /* --------------------------------
       CENTER
    -------------------------------- */

    .hero {
      position: absolute;
      left: 50%;
      top: 48%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      color: #1769e0;

      font-size: clamp(70px, 6.2vw, 105px);
      line-height: 1;
      font-weight: 700;

      letter-spacing: -4px;
    }

    .subtitle-row {
      margin-top: 23px;

      display: flex;
      align-items: center;
      gap: 24px;
    }

    .subtitle-line {
      width: 230px;
      height: 3px;
      background: #d9c9ef;
    }

    .subtitle {
      font-size: 18px;
      color: #777;
      font-weight: 400;
      white-space: nowrap;
    }


    /* --------------------------------
       LEFT VERTICAL TEXT
    -------------------------------- */

    .vertical-text {
      position: absolute;

      left: 43px;
      bottom: 108px;

      writing-mode: vertical-rl;
      transform: rotate(180deg);

      font-size: 16px;
      color: #777;

      letter-spacing: -0.2px;
    }


    /* --------------------------------
       BOTTOM LEFT DECORATION
    -------------------------------- */

    .corner {
      position: absolute;

      left: 48px;
      bottom: 37px;

      width: 122px;
      height: 39px;

      border-left: 3px solid #d9c9ef;
      border-top: 3px solid #d9c9ef;
    }


    /* --------------------------------
       BOTTOM RIGHT BLURRED TEXT
    -------------------------------- */

    .blur-text {
      position: absolute;

      right: 39px;
      bottom: 38px;

      width: 185px;

      display: flex;
      flex-direction: column;
      gap: 7px;

      opacity: 0.42;
    }

    .blur-text span {
      display: block;

      height: 9px;

      background: #bcbcbc;

      filter: blur(5px);
    }

    .blur-text span:nth-child(1) {
      width: 170px;
    }

    .blur-text span:nth-child(2) {
      width: 155px;
      margin-left: 17px;
    }

    .blur-text span:nth-child(3) {
      width: 180px;
      margin-left: 3px;
    }


    /* --------------------------------
       RESPONSIVE
    -------------------------------- */

    @media (max-width: 768px) {

      .page {
        width: calc(100vw - 28px);
        height: calc(100vh - 28px);
        margin: 14px auto;
      }

      .profile {
        top: 25px;
        left: 25px;
      }

      .profile .role {
        font-size: 13px;
      }

      .profile .name {
        font-size: 14px;
      }

      .year {
        top: 25px;
        right: 25px;
        font-size: 13px;
        line-height: 15px;
      }

      .year-line {
        height: 25px;
        margin-top: 7px;
      }

      .hero {
        width: 90%;
        top: 48%;
      }

      .title {
        font-size: clamp(48px, 14vw, 80px);
        letter-spacing: -3px;
      }

      .subtitle-row {
        gap: 12px;
        margin-top: 17px;
      }

      .subtitle-line {
        width: 90px;
        height: 2px;
      }

      .subtitle {
        font-size: 13px;
      }

      .vertical-text {
        left: 27px;
        bottom: 100px;
        font-size: 12px;
      }

      .corner {
        left: 30px;
        bottom: 28px;
        width: 80px;
        height: 30px;
      }

      .blur-text {
        right: 25px;
        bottom: 27px;
        width: 100px;
      }

      .blur-text span {
        height: 6px;
      }

      .blur-text span:nth-child(1) {
        width: 95px;
      }

      .blur-text span:nth-child(2) {
        width: 80px;
        margin-left: 10px;
      }

      .blur-text span:nth-child(3) {
        width: 100px;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- Top left -->
    <div class="profile">
      <div class="role">UI/UX designer</div>
      <div class="name">Eun-Gyeong Lee</div>
    </div>


    <!-- Top right -->
    <div class="year">
      <span>2</span>
      <span>0</span>
      <span>1</span>
      <span>8</span>

      <div class="year-line"></div>
    </div>


    <!-- Center -->
    <section class="hero">

      <h1 class="title">
        Portfolio
      </h1>

      <div class="subtitle-row">
        <div class="subtitle-line"></div>

        <span class="subtitle">
          my own works
        </span>
      </div>

    </section>


    <!-- Left vertical text -->
    <div class="vertical-text">
      come in handy the world
    </div>


    <!-- Bottom left -->
    <div class="corner"></div>


    <!-- Bottom right -->
    <div class="blur-text">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </main>

</body>
</html>
