<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body { background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    .portfolio { position: relative; width: 100vw; height: 100vh; }
    /* TOP / LEFT SMALL TITLE */
    .category { position: absolute; left: 9.2vw; top: 38.5vh; font-size: 20px; font-weight: 400; letter-spacing: -0.5px; }
    /* MAIN TITLE */
    .title { position: absolute; left: 8.9vw; top: 43.7vh; display: flex; align-items: baseline; font-size: clamp(70px, 7vw, 100px); line-height: 1; font-weight: 800; letter-spacing: -5px; }
    .title .dot { font-size: 70px; font-weight: 400; margin-left: 3px; letter-spacing: 0; }
    /* YEAR */
    .year { position: absolute; right: 8vw; top: 46.5vh; font-size: clamp(48px, 4.5vw, 62px); line-height: 1; font-weight: 300; letter-spacing: -2px; color: white; -webkit-text-stroke: 1.5px #222; text-shadow: 0 0 0 #222; }
    /* NAME PILL */
    .name { position: absolute; left: 8.8vw; top: 65%; width: 360px; height: 57px; display: flex; align-items: center; justify-content: center; border: 1px solid #777; border-radius: 999px; font-size: 20px; font-weight: 400; letter-spacing: -0.3px; }
    /* RESPONSIVE */
    @media (max-width: 768px) {
      .category { left: 8vw; top: 34vh; font-size: 14px; }
      .title { left: 7.5vw; top: 40vh; font-size: clamp(48px, 14vw, 76px); letter-spacing: -4px; }
      .title .dot { font-size: 48px; }
      .year { right: 7vw; top: 43vh; font-size: clamp(30px, 8vw, 48px); }
      .name { left: 7.5vw; top: 58%; width: 270px; height: 48px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="portfolio">
    <!-- Small category -->
    <div class="category">INTERACTION DESIGN</div>
    <!-- Main title -->
    <h1 class="title">Portfolio<span class="dot">.</span></h1>
    <!-- Year -->
    <div class="year">2022</div>
    <!-- Name -->
    <div class="name">ANUSHKA GOPALAKRISHNAN</div>
  </main>
</body>
</html>
